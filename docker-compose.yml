services:
 wb2api:
 build: .
 container_name: workbuddy2api
 restart: unless-stopped
 # Контейнер по умолчанию с app Пользователь (uid 10001）Запуск. Несовпадение владельца директории монтирования хоста приведет к
 # 「запись auths/*.json.tmp ошибка permission denied」，Любой из трёх вариантов решения:
 # 1) не root · запустить контейнер от своего имени uid запуск (директория монтирования изначально создана вами):
 # PUID=$(id -u) PGID=$(id -g) docker compose up -d
 # или записать в .env Файл:PUID=1000 / PGID=1000
 # 2) sudo chown -R 10001:10001 ./auths ./data ./config.json
 # 3) user: "0:0" по root запуск (проще, но поверхность побега из контейнера больше — на свой риск)
 user: "${PUID:-10001}:${PGID:-10001}"
 environment:
 - TZ=Asia/Shanghai
 ports:
 - "7863:7863"
 volumes:
 - ./auths:/app/auths
 - ./data:/app/data
 # Внимание: на хосте должно быть config.json（cp config.example.json config.json）。
 # При отсутствии Docker Создаст точку монтирования как директорию → сбой запуска контейнера (программа автоматически сгенерирует конфиг,
 # но при условии возможности записи в виде файла —— Смонтированная директория перекроет этот путь).
 # не вешать :ro：Страница «Конфигурация» панели должна записать обратно в этот файл (горячее применение после сохранения).
 - ./config.json:/app/config.json
